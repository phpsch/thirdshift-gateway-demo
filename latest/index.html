<link rel="stylesheet" href="ci/css/ts-tokens.css"><link rel="stylesheet" href="ci/css/ts-fonts.css"><link rel="stylesheet" href="ci/css/ts-type.css"><link rel="stylesheet" href="ci/css/ts-components.css">
<style>
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; background: var(--ts-color-surface-page, #f5f5f5); color: var(--ts-color-text-primary); font-family: var(--ts-type-body-family, system-ui); }
.gate { width: min(360px, calc(100vw - 32px)); padding: 28px 28px 24px; background: var(--ts-color-surface-raised, #fff); border: 1px solid var(--ts-color-border-default, #ddd); border-radius: var(--ts-card-radius, 12px); }
.gate h1 { margin: 0 0 4px; font-size: 18px; font-weight: 500; }
.gate p { margin: 0 0 20px; color: var(--ts-color-text-secondary); font-size: 14px; }
.gate label { display: block; margin-bottom: 12px; }
.gate input { width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border: 1px solid var(--ts-color-border-strong, #bbb); border-radius: var(--ts-gateway-radius-control, 8px); background: var(--ts-color-surface-raised, #fff); color: inherit; font: inherit; }
.gate input:focus { outline: 2px solid var(--ts-focus-color, #2563eb); outline-offset: 1px; }
.gate button { width: 100%; height: 40px; border: 0; border-radius: var(--ts-gateway-radius-control, 8px); background: var(--ts-color-text-primary, #111); color: var(--ts-color-surface-raised, #fff); font: inherit; font-weight: 500; cursor: pointer; }
.gate button[disabled] { opacity: .6; cursor: default; }
.err { min-height: 20px; margin: 10px 0 0; color: var(--ts-color-status-denied-fg, #b42318); font-size: 13px; }
.mark { display: inline-block; margin-bottom: 16px; font-family: var(--ts-gateway-type-sm-family, ui-monospace, monospace); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ts-color-text-tertiary); }
</style></head>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const KEY = "ts-demo-key";
  const form = document.getElementById("gate"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
  async function keyFrom(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
    const html = new TextDecoder().decode(plain);
    try { sessionStorage.setItem(KEY, JSON.stringify(Array.from(new Uint8Array(await crypto.subtle.exportKey("raw", key))))); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  form.addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = ""; go.disabled = true;
    try { await open(await keyFrom(pw.value)); }
    catch (e) { err.textContent = "That is not the password."; pw.select(); go.disabled = false; }
  });
  // Same tab, already unlocked: open straight away (the Gateway reloads itself when the client pack changes).
  // Only once this page is fully parsed: document.open() cannot replace a document that is still being written.
  (async () => { try { const raw = sessionStorage.getItem(KEY); if (!raw) return;
    if (document.readyState !== "complete") await new Promise(r => window.addEventListener("load", r, { once: true }));
    const key = await crypto.subtle.importKey("raw", new Uint8Array(JSON.parse(raw)), { name: "AES-GCM" }, true, ["decrypt"]); await open(key); } catch (e) { try { sessionStorage.removeItem(KEY); } catch (_) {} } })();
})();
</script>
